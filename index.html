<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do List</title>
    <link rel="icon" href="favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=2" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2" />
    <link rel="manifest" href="manifest.json?v=2" />
    <meta name="apple-mobile-web-app-title" content="To Do List" />
    <script>
      (function () {
        var data = navigator.userAgentData;
        var windows =
          /Windows/i.test(navigator.userAgent || "") ||
          /Win/i.test(navigator.platform || "") ||
          (data && /Windows/i.test(data.platform || ""));
        if (windows) return;
        var theme = document.createElement("meta");
        theme.name = "theme-color";
        theme.content = "#FF5500";
        document.head.appendChild(theme);
      })();
    </script>
    <link rel="stylesheet" href="styles.css?v=27" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>To Do List</h1>
        <div class="logo">
          <img src="goose-head.png?v=1" alt="" />
          <span class="mark">GEESE</span>
        </div>
      </header>

      <section class="log" aria-label="To do list">
        <div class="log-header">
          <div class="log-toolbar">
            <button type="button" id="import-button" class="save-button icon-button" title="Import" aria-label="Import">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
              </svg>
            </button>
            <button type="button" id="export-button" class="save-button icon-button" title="Export" aria-label="Export">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                <polyline points="17 21 17 13 7 13 7 21" />
                <polyline points="7 3 7 8 15 8" />
              </svg>
            </button>
            <button type="button" id="done-toggle" class="save-button mode-split">
              <span class="mode-check" aria-hidden="true"></span>
              <span class="mode-word is-selected" data-mode="place">Sorted</span>
              <span class="mode-slash" aria-hidden="true">/</span>
              <span class="mode-word" data-mode="bottom">Bottom</span>
            </button>
            <button type="button" id="sort-toggle" class="save-button mode-split">
              <span class="mode-check mode-ring" aria-hidden="true"></span>
              <span class="mode-word" data-mode="alpha">A-Z</span>
              <span class="mode-slash" aria-hidden="true">/</span>
              <span class="mode-word is-selected" data-mode="manual">Sorted</span>
            </button>
          </div>
          <input id="import-input" type="file" accept=".txt,text/plain" hidden />
        </div>
        <div id="clear-warning" class="clear-warning" hidden>
          <p>Delete every item? This cannot be undone.</p>
          <div class="clear-warning-actions">
            <button type="button" id="clear-cancel" class="save-button">Cancel</button>
            <button type="button" id="clear-confirm" class="save-button clear-button">Delete all</button>
          </div>
        </div>
        <p id="save-status" class="save-status" hidden></p>
        <div class="log-scroll">
          <ul id="todo-list" class="todo-list"></ul>
        </div>
      </section>
    </main>

    <script src="app.js?v=23"></script>
  </body>
</html>
