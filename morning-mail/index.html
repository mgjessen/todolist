<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f3f3">
  <title>Morning Report</title>
  <style>
    :root {
      --bg: #f3f3f3;
      --card: #ffffff;
      --ink: #1a1a1a;
      --muted: #5d5d5d;
      --line: #e5e5e5;
      --line-strong: #d1d1d1;
      --send: #0c4a6e;
      --send-hover: #08344e;
      --focus: #0c4a6e;
      --warn: #7a3e12;
      --danger: #8c2f2f;
      --stick-top: 96px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.45 "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    .page {
      max-width: 1120px;
      margin: 0 auto;
      padding: 8px 24px 48px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px 28px;
      padding: 16px 0 14px;
      background: var(--bg);
    }

    h1 {
      margin: 0;
      font-size: 1.6rem;
      letter-spacing: -0.02em;
    }

    .lede {
      margin: 6px 0 0;
      max-width: 42rem;
      color: var(--muted);
    }

    .send-cluster {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      flex: 0 0 auto;
    }

    .notes {
      margin: 0;
      padding: 0;
      list-style: none;
      text-align: right;
      color: var(--warn);
      font-size: 0.92rem;
      max-width: 22rem;
    }

    .notes li + li { margin-top: 2px; }

    button.send {
      display: inline-block;
      min-width: 9.5rem;
      padding: 0.8rem 1.5rem;
      border: 0;
      border-radius: 8px;
      background: var(--send);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.01em;
    }

    .send-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button.clear {
      padding: 0.8rem 1.1rem;
      border: 0;
      border-radius: 8px;
      background: #c42b1c;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 650;
    }

    button.clear:hover { background: #a82418; color: #fff; }
    button.clear:active { background: #8c1d14; }

    button.send:hover { background: var(--send-hover); color: #fff; }
    button.send:active { background: #062433; }

    button.send:focus-visible,
    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    summary:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    main {
      display: grid;
      grid-template-columns: minmax(300px, 380px) minmax(0, 1fr);
      gap: 20px;
      align-items: start;
      margin-top: 18px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      min-width: 0;
    }

    aside.card {
      position: sticky;
      top: var(--stick-top);
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - var(--stick-top) - 16px);
      overflow: hidden;
    }

    aside.card > h2,
    aside.card > .hint,
    aside.card > .count,
    aside.card > .add-form {
      flex: 0 0 auto;
    }

    h2 {
      margin: 0 0 4px;
      font-size: 1.15rem;
    }

    .hint {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .count {
      margin: 0 0 8px;
      font-size: 0.88rem;
      font-weight: 650;
      color: var(--send);
    }

    #recipients {
      list-style: none;
      margin: 0;
      padding: 0;
      overflow: auto;
      min-height: 0;
      flex: 1 1 auto;
    }

    .recipient {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 4px 8px;
      padding: 8px 6px;
      border-bottom: 1px solid #ededed;
      border-radius: 8px;
    }

    .recipient.is-checked { background: #f5f5f5; }

    .check {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      flex: 1;
      min-width: 0;
      cursor: pointer;
      font-weight: 400;
    }

    .check input {
      width: 1.05rem;
      height: 1.05rem;
      margin-top: 3px;
      accent-color: var(--send);
      flex: 0 0 auto;
    }

    .identity { min-width: 0; }

    .name {
      display: block;
      overflow-wrap: break-word;
    }

    .name { font-weight: 650; }

    .actions {
      display: flex;
      gap: 2px;
      margin-left: auto;
      flex: 0 0 auto;
      white-space: nowrap;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .ghost {
      background: transparent;
      border: 0;
      color: var(--send);
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 0.85rem;
    }

    .ghost:hover { background: #f0f0f0; }
    .ghost.danger { color: var(--danger); }

    li.empty {
      display: block;
      color: var(--muted);
      padding: 8px 4px 12px;
    }

    .add-form,
    .edit-form {
      display: grid;
      gap: 8px;
    }

    .add-form {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .edit-form,
    .confirm-row { flex: 1 1 100%; }

    .confirm-text { margin: 4px 0; font-weight: 650; }

    .edit-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    button.secondary,
    button.quiet {
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 650;
    }

    button.secondary {
      background: var(--send);
      color: #fff;
      border: 0;
      justify-self: start;
    }

    button.secondary:hover { background: var(--send-hover); }

    button.quiet {
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line-strong);
    }

    button.danger-solid {
      background: var(--danger);
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 650;
    }

    .form-error {
      margin: 0;
      color: var(--danger);
      font-size: 0.88rem;
    }

    .subject-field { margin: 8px 0 4px; }

    .group + .group { margin-top: 20px; }

    .group h3 {
      margin: 0 0 10px;
      font-size: 0.95rem;
      color: #3b3b3b;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 16px;
    }

    .grid-3 { grid-template-columns: 0.7fr 1.4fr 1fr; }
    .grid-even { grid-template-columns: 1fr 1fr 1fr; }

    .wide { grid-column: 1 / -1; }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.92rem;
      font-weight: 650;
      min-width: 0;
    }

    .field input,
    .field textarea {
      font: inherit;
      font-weight: 450;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      padding: 8px 10px;
      width: 100%;
    }

    textarea.grow {
      display: block;
      resize: none;
      overflow: hidden;
      line-height: 1.4;
      min-height: 2.45rem;
      field-sizing: content;
    }

    .preview {
      margin-top: 18px;
      border-top: 1px solid var(--line);
      padding-top: 12px;
    }

    .preview summary {
      cursor: pointer;
      font-weight: 700;
    }

    #preview {
      background: #f7f7f7;
      border-radius: 8px;
      padding: 12px;
      margin: 10px 0 0;
      overflow-x: auto;
      min-height: 2.5rem;
    }

    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
      aside.card {
        position: static;
        max-height: none;
        overflow: visible;
      }
      .grid-3, .grid-even { grid-template-columns: 1fr; }
    }

    @media (max-width: 720px) {
      .page { padding: 8px 14px 36px; }
      header { flex-direction: column; }
      .send-cluster, .notes { align-items: stretch; text-align: left; max-width: none; }
      .send-row { width: 100%; }
      button.send { flex: 1; }
      .grid, .grid-3, .grid-even { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <h1>Morning Report</h1>
      </div>
      <div class="send-cluster">
        <div class="send-row">
          <button id="clear" class="clear" type="button">Clear</button>
          <button id="send" class="send" type="button">Send</button>
        </div>
        <ul id="notes" class="notes" aria-live="polite" hidden></ul>
      </div>
    </header>

    <main>
      <aside class="card" aria-labelledby="recipients-title">
        <h2 id="recipients-title">Recipients</h2>
        <p class="count" id="count"></p>
        <ul id="recipients"></ul>
        <form id="add-form" class="add-form" autocomplete="off">
          <label class="field">
            <span class="lab">Name</span>
            <input id="add-name" name="name" autocomplete="name">
          </label>
          <label class="field">
            <span class="lab">Email</span>
            <input id="add-email" name="email" inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="email" placeholder="name@company.com">
          </label>
          <p id="add-error" class="form-error" hidden></p>
          <button class="secondary" type="submit">Add</button>
        </form>
      </aside>

      <section class="card" id="report" aria-labelledby="report-title">
        <h2 id="report-title">Report</h2>
        <label class="field subject-field">
          <span class="lab">Subject</span>
          <input id="subject" lang="en" autocomplete="off" spellcheck="false">
        </label>
        <div class="group" data-group>
          <div class="grid">
            <label class="field"><span class="lab">Client:</span><input id="client" data-label="Client" lang="en" autocomplete="off" spellcheck="false"></label>
            <label class="field"><span class="lab">Rig:</span><input id="rig" data-label="Rig" lang="en" autocomplete="off" spellcheck="false"></label>
            <label class="field"><span class="lab">Field:</span><input id="field" data-label="Field" lang="en" autocomplete="off" spellcheck="false"></label>
            <label class="field"><span class="lab">Well:</span><input id="well" data-label="Well" lang="en" autocomplete="off" spellcheck="false"></label>
          </div>
        </div>

        <div class="group" data-group>
          <div class="grid">
            <label class="field wide"><span class="lab">Current Service:</span><textarea id="currentService" class="grow" data-label="Current Service" lang="en" rows="1" spellcheck="true"></textarea></label>
            <label class="field wide"><span class="lab">Completed Service:</span><textarea id="completedService" class="grow" data-label="Completed Service" lang="en" rows="1" spellcheck="true"></textarea></label>
            <label class="field wide"><span class="lab">Next Service:</span><textarea id="nextService" class="grow" data-label="Next Service" lang="en" rows="1" spellcheck="true"></textarea></label>
          </div>
        </div>

        <div class="group" data-group>
          <div class="grid">
            <label class="field"><span class="lab">JA:</span><input id="ja" data-label="JA" lang="en" autocomplete="off" spellcheck="false"></label>
            <label class="field"><span class="lab">ZOS/SAP (USD):</span><textarea id="zosSap" class="grow" data-label="ZOS/SAP (USD)" lang="en" rows="1" spellcheck="false"></textarea></label>
            <label class="field"><span class="lab">Unit Phone Number:</span><input id="unitPhone" data-label="Unit Phone Number" lang="en" autocomplete="off" spellcheck="false" inputmode="tel"></label>
            <label class="field"><span class="lab">ZOS/SAP (NOK):</span><textarea id="zosSapNok" class="grow" data-label="ZOS/SAP (NOK)" lang="en" rows="1" spellcheck="false"></textarea></label>
          </div>
        </div>

        <div class="group" data-group>
          <div class="grid">
            <label class="field wide"><span class="lab">Dayshift:</span><textarea id="dayshift" class="grow" data-label="Dayshift" lang="en" rows="1" spellcheck="true"></textarea></label>
            <label class="field wide"><span class="lab">Nightshift:</span><textarea id="nightshift" class="grow" data-label="Nightshift" lang="en" rows="1" spellcheck="true"></textarea></label>
            <label class="field wide"><span class="lab">Flex:</span><textarea id="flex" class="grow" data-label="Flex" lang="en" rows="1" spellcheck="true"></textarea></label>
            <label class="field wide"><span class="lab">Crewchanges:</span><textarea id="crewchanges" class="grow" data-label="Crewchanges" lang="en" rows="1" spellcheck="true"></textarea></label>
          </div>
        </div>

        <div class="group" data-group>
          <div class="grid">
            <label class="field wide"><span class="lab">HSE:</span><textarea id="hse" class="grow" data-label="HSE" lang="en" rows="1" spellcheck="true"></textarea></label>
          </div>
        </div>

        <div class="group" data-group>
          <div class="grid">
            <label class="field wide"><span class="lab">Rig Activity:</span><textarea id="rigActivity" class="grow" data-label="Rig Activity" lang="en" rows="1" spellcheck="true"></textarea></label>
            <label class="field wide"><span class="lab">BKR Activity:</span><textarea id="bkrActivity" class="grow" data-label="BKR Activity" lang="en" rows="1" spellcheck="true"></textarea></label>
          </div>
        </div>

        <div class="group" data-group>
          <div class="grid">
            <label class="field wide"><span class="lab">FYI:</span><textarea id="fyi" class="grow" data-label="FYI" lang="en" rows="1" spellcheck="true"></textarea></label>
            <label class="field wide"><span class="lab">Logistics:</span><textarea id="logistics" class="grow" data-label="Logistics" lang="en" rows="1" spellcheck="true"></textarea></label>
            <label class="field wide"><span class="lab">Questions:</span><textarea id="questions" class="grow" data-label="Questions" lang="en" rows="1" spellcheck="true"></textarea></label>
            <label class="field wide"><span class="lab">Wants:</span><textarea id="wants" class="grow" data-label="Wants" lang="en" rows="1" spellcheck="true"></textarea></label>
            <label class="field wide"><span class="lab">Other:</span><textarea id="other" class="grow" data-label="Other" lang="en" rows="1" spellcheck="true"></textarea></label>
          </div>
        </div>

        <details class="preview">
          <summary>Preview</summary>
          <div id="preview" lang="en"></div>
        </details>
      </section>
    </main>
  </div>

  <noscript>
    <p class="lede" style="max-width:1120px;margin:16px auto;padding:0 24px;">This page needs JavaScript. It only saves in this browser and does not send anything to a server.</p>
  </noscript>

  <script>
    "use strict";

    // Subject formula from Morning Report!D3:
    // ="NO - "&D5&" - "&D7&" - Morning Report"
    // D5 is Client, D7 is Field.

    const RECIPIENTS_KEY = "morning-mail-recipients";
    const DRAFT_KEY = "morning-mail-draft-v2";

    const SEED = [
      { name: "BAADR", email: "BAADR@bakerhughes.com", checked: false },
      { name: "Duty Manager", email: "DutyManagerBAStv@bakerhughes.com", checked: false },
      { name: "altus_altus-ops@bakerhughes.com", email: "altus_altus-ops@bakerhughes.com", checked: true }
    ];

    const subjectEl = document.getElementById("subject");
    const previewEl = document.getElementById("preview");
    const notesEl = document.getElementById("notes");
    const countEl = document.getElementById("count");
    const sendEl = document.getElementById("send");
    const listEl = document.getElementById("recipients");
    const addForm = document.getElementById("add-form");
    const addName = document.getElementById("add-name");
    const addEmail = document.getElementById("add-email");
    const addError = document.getElementById("add-error");
    const reportEl = document.getElementById("report");

    let seq = 1;
    let subjectTouched = false;
    let editingId = null;
    let confirmId = null;
    let storageOk = true;

    function nextId() {
      seq += 1;
      return "r" + Date.now().toString(36) + seq.toString(36);
    }

    function fieldElements() {
      return [...document.querySelectorAll("[data-label]")];
    }

    function valueOf(el) {
      return el.value.replace(/\r\n/g, "\n").trim();
    }

    function patternSubject() {
      const client = valueOf(document.getElementById("client"));
      const field = valueOf(document.getElementById("field"));
      if (!client && !field) return "";
      return "NO - " + client + " - " + field + " - Morning Report";
    }

    function bodyIsEmpty() {
      return !fieldElements().some((el) => valueOf(el) !== "");
    }

    function autosize(el) {
      if (!(el instanceof HTMLTextAreaElement)) return;
      el.style.height = "auto";
      el.style.height = el.scrollHeight + "px";
    }

    function autosizeAll() {
      document.querySelectorAll("textarea.grow").forEach(autosize);
    }

    function mailFieldElements() {
      const fields = fieldElements();
      const phoneAt = fields.findIndex((el) => el.id === "unitPhone");
      const nokAt = fields.findIndex((el) => el.id === "zosSapNok");
      if (phoneAt !== -1 && nokAt !== -1 && phoneAt < nokAt) {
        const [phone] = fields.splice(phoneAt, 1);
        const afterNok = fields.findIndex((el) => el.id === "zosSapNok");
        fields.splice(afterNok + 1, 0, phone);
      }
      return fields;
    }

    function buildMailTable() {
      const table = document.createElement("table");
      table.setAttribute("cellspacing", "0");
      table.setAttribute("cellpadding", "0");
      table.setAttribute("style", "border-collapse:collapse; font-family:Calibri,Arial,sans-serif; font-size:11pt;");
      mailFieldElements().forEach((el) => {
        const tr = document.createElement("tr");
        const label = document.createElement("td");
        label.setAttribute("style", "font-weight:bold; text-align:right; vertical-align:top; padding:2px 16px 2px 0; white-space:nowrap;");
        const strong = document.createElement("b");
        strong.textContent = el.dataset.label + ":";
        label.append(strong);
        const value = document.createElement("td");
        value.setAttribute("style", "vertical-align:top; padding:2px 0;");
        valueOf(el).split("\n").forEach((line, index) => {
          if (index) value.append(document.createElement("br"));
          value.append(document.createTextNode(line));
        });
        tr.append(label, value);
        table.append(tr);
      });
      return table;
    }

    function messageDocument() {
      const doc = document.implementation.createHTMLDocument("");
      doc.documentElement.setAttribute("lang", "en");
      const meta = doc.createElement("meta");
      meta.setAttribute("charset", "utf-8");
      doc.head.append(meta);
      const body = doc.body;
      body.style.margin = "0";
      body.style.fontFamily = "Calibri, Arial, sans-serif";
      body.style.fontSize = "11pt";
      body.append(buildMailTable());
      return "<!DOCTYPE html>\r\n" + doc.documentElement.outerHTML;
    }

    function encodeHeader(value) {
      const clean = String(value).replace(/[\r\n]+/g, " ");
      if (/^[\x20-\x7E]*$/.test(clean)) return clean;
      const bytes = new TextEncoder().encode(clean);
      let binary = "";
      bytes.forEach((byte) => {
        binary += String.fromCharCode(byte);
      });
      return "=?UTF-8?B?" + btoa(binary) + "?=";
    }

    function buildEml() {
      const to = recipients
        .filter((rec) => rec.checked && rec.email.trim())
        .map((rec) => rec.email.trim())
        .join(", ");
      return [
        "To: " + to,
        "Subject: " + encodeHeader(subjectEl.value),
        "X-Unsent: 1",
        "MIME-Version: 1.0",
        "Content-Type: text/html; charset=utf-8",
        "",
        messageDocument()
      ].join("\r\n");
    }

    function openOutlookDraft() {
      const eml = buildEml();
      const file = new File([eml], "Morning Report.eml", { type: "message/rfc822" });
      const url = URL.createObjectURL(file);
      const link = document.createElement("a");
      link.href = url;
      link.download = file.name;
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    }

    function appendBreakable(parent, text) {
      const parts = String(text).split(/([@._-])/);
      parts.forEach((part) => {
        parent.append(part);
        if (/[@._-]/.test(part)) parent.append(document.createElement("wbr"));
      });
    }

    function emailOk(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function validate(name, email, requireEmail) {
      if (!name) return "Enter a name.";
      if (!email && requireEmail) return "Enter an email address.";
      if (email && !emailOk(email)) return "That email address looks invalid.";
      return "";
    }

    function setError(el, message) {
      el.hidden = !message;
      el.textContent = message || "";
    }

    function freshRecipient(raw) {
      const name = String(raw && raw.name || "").trim();
      const email = String(raw && raw.email || "").trim();
      return {
        id: raw && typeof raw.id === "string" && raw.id ? raw.id : nextId(),
        name: name || email,
        email: email,
        checked: !!(raw && raw.checked)
      };
    }

    function loadJson(key) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch (err) {
        storageOk = false;
        return null;
      }
    }

    function persist(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
        storageOk = true;
      } catch (err) {
        storageOk = false;
      }
    }

    function loadRecipients() {
      const data = loadJson(RECIPIENTS_KEY);
      if (!Array.isArray(data)) return null;
      const list = data
        .map(freshRecipient)
        .filter((rec) => rec.name || rec.email);
      const kept = list.filter((rec) => {
        if (rec.email !== "") return true;
        return rec.name !== "Personnel Planner" && rec.name !== "Crew";
      });
      let changed = kept.length !== list.length;
      kept.forEach((rec) => {
        if (rec.name === "Duty Manager Stv") {
          rec.name = "Duty Manager";
          rec.email = "DutyManagerBAStv@bakerhughes.com";
          changed = true;
        }
        if (rec.name === "BAADR" && rec.email === "") {
          rec.email = "BAADR@bakerhughes.com";
          changed = true;
        }
      });
      if (changed) persist(RECIPIENTS_KEY, kept);
      return kept;
    }

    let recipients = loadRecipients();
    if (recipients === null) recipients = SEED.map(freshRecipient);

    function saveRecipients() {
      persist(RECIPIENTS_KEY, recipients);
    }

    function clearReport() {
      fieldElements().forEach((el) => {
        el.value = "";
      });
      subjectTouched = false;
      subjectEl.value = "";
      saveDraft();
      refresh();
    }

    function saveDraft() {
      const values = {};
      fieldElements().forEach((el) => {
        values[el.id] = el.value;
      });
      persist(DRAFT_KEY, {
        subjectTouched: subjectTouched,
        subject: subjectEl.value,
        values: values
      });
    }

    function applyDraft() {
      const draft = loadJson(DRAFT_KEY);
      if (!draft || !draft.values || typeof draft.values !== "object" || Array.isArray(draft.values)) return;
      fieldElements().forEach((el) => {
        if (typeof draft.values[el.id] === "string") el.value = draft.values[el.id];
      });
      subjectTouched = draft.subjectTouched === true;
      subjectEl.value = subjectTouched && typeof draft.subject === "string"
        ? draft.subject
        : patternSubject();
    }

    function noteLines() {
      const lines = [];
      if (subjectEl.value.trim() === "") lines.push("The subject is empty.");
      if (bodyIsEmpty()) lines.push("The message is empty.");
      const checked = recipients.filter((rec) => rec.checked);
      if (checked.length === 0) lines.push("No recipients are checked.");
      const missing = checked.filter((rec) => !rec.email.trim());
      if (missing.length) {
        lines.push("Missing an email address, left out: " + missing.map((rec) => rec.name).join(", "));
      }
      if (!storageOk) lines.push("Could not save in this browser.");
      return lines;
    }

    function refresh() {
      previewEl.replaceChildren(buildMailTable());
      autosizeAll();
      const lines = noteLines();
      notesEl.replaceChildren();
      lines.forEach((text) => {
        const li = document.createElement("li");
        li.textContent = text;
        notesEl.append(li);
      });
      notesEl.hidden = lines.length === 0;
      const ready = recipients.filter((rec) => rec.checked && rec.email.trim()).length;
      countEl.textContent = ready === 1 ? "1 recipient selected" : ready + " recipients selected";
      const header = document.querySelector("header");
      document.documentElement.style.setProperty("--stick-top", (header.offsetHeight + 12) + "px");
    }

    function button(label, action, className) {
      const el = document.createElement("button");
      el.type = "button";
      el.dataset.action = action;
      el.className = className || "ghost";
      el.textContent = label;
      return el;
    }

    function renderRecipients() {
      listEl.replaceChildren();
      if (!recipients.length) {
        const empty = document.createElement("li");
        empty.className = "empty";
        empty.textContent = "No recipients yet. Add a name and email below.";
        listEl.append(empty);
      }
      recipients.forEach((rec) => {
        if (rec.id === editingId) {
          listEl.append(renderEdit(rec));
          return;
        }
        if (rec.id === confirmId) {
          listEl.append(renderConfirm(rec));
          return;
        }
        listEl.append(renderRow(rec));
      });
      const editName = listEl.querySelector('.edit-form [name="name"]');
      if (editName) editName.focus();
      refresh();
    }

    function renderRow(rec) {
      const li = document.createElement("li");
      li.className = "recipient" + (rec.checked ? " is-checked" : "");
      li.dataset.id = rec.id;

      const label = document.createElement("label");
      label.className = "check";
      const box = document.createElement("input");
      box.type = "checkbox";
      box.checked = rec.checked;
      const identity = document.createElement("span");
      identity.className = "identity";
      const name = document.createElement("span");
      name.className = "name";
      appendBreakable(name, rec.name);
      identity.append(name);
      label.append(box, identity);

      const actions = document.createElement("div");
      actions.className = "actions";
      actions.append(button("Edit", "edit"), button("Delete", "delete", "ghost danger"));
      li.append(label, actions);
      return li;
    }

    function renderEdit(rec) {
      const li = document.createElement("li");
      li.className = "recipient";
      li.dataset.id = rec.id;
      const form = document.createElement("form");
      form.className = "edit-form";
      form.autocomplete = "off";

      form.append(labeledInput("Name", "name", rec.name, "text"));
      form.append(labeledInput("Email", "email", rec.email, "email"));
      const error = document.createElement("p");
      error.className = "form-error";
      error.hidden = true;
      form.append(error);

      const actions = document.createElement("div");
      actions.className = "edit-actions";
      const save = document.createElement("button");
      save.type = "submit";
      save.className = "secondary";
      save.textContent = "Save";
      actions.append(save, button("Cancel", "cancel-edit", "quiet"));
      form.append(actions);
      li.append(form);
      return li;
    }

    function labeledInput(label, name, value, kind) {
      const wrap = document.createElement("label");
      wrap.className = "field";
      const span = document.createElement("span");
      span.className = "lab";
      span.textContent = label;
      const input = document.createElement("input");
      input.name = name;
      input.value = value;
      if (kind === "email") {
        input.inputMode = "email";
        input.spellcheck = false;
        input.autocomplete = "email";
      } else {
        input.autocomplete = "name";
      }
      wrap.append(span, input);
      return wrap;
    }

    function renderConfirm(rec) {
      const li = document.createElement("li");
      li.className = "recipient confirm-row";
      li.dataset.id = rec.id;
      const text = document.createElement("p");
      text.className = "confirm-text";
      text.textContent = "Delete " + rec.name + "?";
      const actions = document.createElement("div");
      actions.className = "edit-actions";
      actions.append(
        button("Yes, delete", "confirm-delete", "danger-solid"),
        button("Cancel", "cancel-delete", "quiet")
      );
      li.append(text, actions);
      return li;
    }

    function findRecipient(id) {
      return recipients.find((rec) => rec.id === id);
    }

    listEl.addEventListener("change", (event) => {
      const input = event.target;
      if (!(input instanceof HTMLInputElement) || input.type !== "checkbox") return;
      const rec = findRecipient(input.closest("li").dataset.id);
      if (!rec) return;
      rec.checked = input.checked;
      input.closest("li").classList.toggle("is-checked", rec.checked);
      saveRecipients();
      refresh();
    });

    listEl.addEventListener("click", (event) => {
      const btn = event.target.closest("button");
      if (!btn || !listEl.contains(btn)) return;
      const id = btn.closest("li").dataset.id;
      const action = btn.dataset.action;
      if (action === "edit") {
        editingId = id;
        confirmId = null;
        renderRecipients();
      } else if (action === "delete") {
        confirmId = id;
        editingId = null;
        renderRecipients();
      } else if (action === "cancel-edit" || action === "cancel-delete") {
        editingId = null;
        confirmId = null;
        renderRecipients();
      } else if (action === "confirm-delete") {
        recipients = recipients.filter((rec) => rec.id !== id);
        editingId = null;
        confirmId = null;
        saveRecipients();
        renderRecipients();
      }
    });

    listEl.addEventListener("submit", (event) => {
      const form = event.target;
      if (!(form instanceof HTMLFormElement)) return;
      event.preventDefault();
      const rec = findRecipient(form.closest("li").dataset.id);
      if (!rec) return;
      const name = form.elements.name.value.trim();
      const email = form.elements.email.value.trim();
      const message = validate(name, email, false);
      setError(form.querySelector(".form-error"), message);
      if (message) return;
      rec.name = name || email;
      rec.email = email;
      editingId = null;
      saveRecipients();
      renderRecipients();
    });

    addForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const name = addName.value.trim();
      const email = addEmail.value.trim();
      const message = validate(name, email, true);
      setError(addError, message);
      if (message) return;
      recipients.push(freshRecipient({ name: name, email: email, checked: true }));
      saveRecipients();
      addForm.reset();
      setError(addError, "");
      editingId = null;
      confirmId = null;
      renderRecipients();
      addName.focus();
    });

    reportEl.addEventListener("input", (event) => {
      const target = event.target;
      if (target === subjectEl) {
        subjectTouched = subjectEl.value !== patternSubject();
      } else if (target.matches && target.matches("[data-label]") && !subjectTouched) {
        subjectEl.value = patternSubject();
      }
      refresh();
      saveDraft();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && (editingId || confirmId)) {
        editingId = null;
        confirmId = null;
        renderRecipients();
        return;
      }
      if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
        event.preventDefault();
        openOutlookDraft();
      }
    });

    sendEl.addEventListener("click", openOutlookDraft);
    document.getElementById("clear").addEventListener("click", () => {
      if (!window.confirm("Clear all fields?")) return;
      clearReport();
    });

    window.addEventListener("resize", refresh);

    applyDraft();
    renderRecipients();
  </script>
</body>
</html>
